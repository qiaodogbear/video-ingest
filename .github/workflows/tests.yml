name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # 刻意只装测试运行器与 linter。
      # 单元测试**不依赖** yt-dlp / faster-whisper / numpy / OCR，
      # 因此 CI 不必下载 GB 级依赖，也能在纯离线环境复现。
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff

      - name: Lint (real-defect rules only)
        run: ruff check video_ingest tests

      - name: Run unit tests
        run: python -m pytest tests -q

      - name: Smoke-test CLI wiring
        run: python -c "import video_ingest.cli as c; p=c.build_parser(); print(sorted(p._subparsers._group_actions[0].choices))"
