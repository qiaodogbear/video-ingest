[project]
name = "video-ingest"
version = "0.2.0"
description = "本地优先的视频取材与转录工具：字幕优先、缺字幕时本地 ASR、全程可核查，并可提取与字幕配对的画面帧"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["bilibili", "transcript", "asr", "whisper", "ocr", "video", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing",
]
dependencies = [
    "yt-dlp>=2025.1.1",
    "faster-whisper>=1.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
# 画面文字识别。onnxruntime 通常已由 faster-whisper 带入。
ocr = ["rapidocr-onnxruntime>=1.3"]

[project.scripts]
video-ingest = "video_ingest.cli:main"

[project.urls]
Homepage = "https://github.com/qiaodogbear/video-ingest"
Issues = "https://github.com/qiaodogbear/video-ingest/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["video_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# 只启用"真实缺陷"类别；风格类（如百分号格式化）在中文长句代码里噪声过大。
select = ["F", "E9", "B", "C4", "RET"]
ignore = ["B008"]
